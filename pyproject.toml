[project]
name = "invest-slm"
version = "0.0.1"
description = "Local LLM-based personal investment advisor for BTC/ETH (Upbit), Samsung Electronics, SK Hynix, Alphabet, NVIDIA"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Personal use only — see project.md section 0" }

dependencies = [
    # Inference / embeddings (Apple Silicon)
    "mlx-lm>=0.19.0; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "sentence-transformers>=3.0.0",
    "transformers>=4.45.0",

    # Vector store / data
    "chromadb>=0.5.0",
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",

    # Market data
    "pyupbit>=0.2.34",
    "pykrx>=1.0.45",
    "finance-datareader>=0.9.90",
    "yfinance>=0.2.40",

    # News / RSS
    "feedparser>=6.0.11",

    # HTTP & utility
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
